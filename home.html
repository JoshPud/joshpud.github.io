<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Joshua Crossley Creative</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IM+Fell+English:ital@1&family=Spectral:wght@600&family=Inter:wght@400&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #titleScreen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    image-rendering: pixelated;
  }

  /* Sky gradient - dark swamp */
  #titleBg {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      #0a0a1a 0%,
      #0f1a0f 40%,
      #0d1f0d 70%,
      #060d06 100%
    );
  }

  /* Stars */
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
  }

  /* Swamp mist */
  .mist {
    position: absolute;
    bottom: 0;
    left: -50%;
    width: 200%;
    height: 180px;
    background: radial-gradient(ellipse at center, rgba(20,60,20,0.4) 0%, transparent 70%);
    animation: driftMist 8s ease-in-out infinite alternate;
  }
  @keyframes driftMist {
    from { transform: translateX(0); }
    to { transform: translateX(5%); }
  }

  /* Pixel trees silhouette */
  .trees {
    position: absolute;
    bottom: 120px;
    left: 0;
    width: 100%;
    height: 200px;
    background:
      /* Tree shapes using box shadows via clip-path workaround - using pure CSS pixel trees */
      repeating-linear-gradient(
        90deg,
        transparent 0px, transparent 60px,
        #0a1a0a 60px, #0a1a0a 80px,
        transparent 80px, transparent 140px
      );
    opacity: 0.8;
  }

  /* Vines */
  .vine {
    position: absolute;
    top: 0;
    width: 3px;
    background: linear-gradient(to bottom, #1a3a1a, #2d5a2d, #1a3a1a, transparent);
    border-radius: 2px;
    animation: sway 3s ease-in-out infinite alternate;
    transform-origin: top center;
  }
  @keyframes sway {
    from { transform: rotate(-3deg); }
    to { transform: rotate(3deg); }
  }



  /* Main content */
  #titleContent {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    margin-bottom: 80px;
  }

  /* Chartreuse decorative line */
  .title-line {
    width: 400px;
    height: 3px;
    background: linear-gradient(to right, transparent, #d5e709, transparent);
    margin: 1rem 0;
  }

  /* Logo */
  #gameLogo {
    width: min(55vw, 480px);
    height: auto;
    filter: drop-shadow(0 0 20px rgba(213,231,9,0.4));
    margin-bottom: 0.5rem;
  }

  /* Subtitle */
  .title-sub {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    color: #FF8902;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 1rem;
    filter: drop-shadow(0 0 8px rgba(255,137,2,0.6));
  }

  /* Press start */
  #pressStart {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(0.75rem, 1.8vw, 1.1rem);
    color: #d5e709;
    letter-spacing: 2px;
    margin-top: 2.5rem;
    animation: blink 1s steps(1) infinite;
    filter: drop-shadow(0 0 8px rgba(213,231,9,0.8));
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Fade overlay */
  #fadeOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 1s ease;
  }
  #fadeOverlay.fading {
    opacity: 1;
  }

  /* Scanline effect */
  #scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.15) 3px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 200;
  }

  /* CRT vignette */
  #vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 201;
  }

  #muteBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    visibility: hidden;
    background: rgba(0,0,0,0.6);
    border: 2px solid #d5e709;
    color: #d5e709;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem;
    padding: 6px 10px;
    cursor: pointer;
    letter-spacing: 1px;
    image-rendering: pixelated;
  }
  #muteBtn:hover { background: rgba(213,231,9,0.15); }

  #hud {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 9999;
    display: none;
    padding: 14px 8px;
    background: rgba(0,0,0,0.5);
    color: #d5e709;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    line-height: 1;
    white-space: pre;
    pointer-events: none;
    user-select: none;
  }

  #gameplayLogo {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    height: 48px;
    width: auto;
    opacity: 1;
    z-index: 9999;
    pointer-events: auto;
    display: none;
    cursor: pointer;
  }
  /* ═══════════ TOP-RIGHT WORD MENU (same as the landing page) ═══════════
     The three buttons become gold words in the top right (lettered like the
     project labels), with small frog-foot dividers. On hover, a bright copy
     of each word fills in from left to right (as on the Shadow of War site). */
  #gameNav {
    top: 22px; right: 28px; bottom: auto;
    gap: 14px; align-items: center;
  }
  #gameNav button {
    height: auto; padding: 4px 0;
    font-family: 'Quadraat Offc Pro', 'Spectral', Georgia, serif; font-weight: 600;
    font-size: 13px; letter-spacing: 3px; color: #FBCEA0; text-shadow: none;
  }
  #gameNav button::before, #gameNav button::after { content: none; display: none; }
  #gameNav .gx-t { display: inline-block; position: relative; }
  #gameNav .gx-t::before {
    content: attr(data-t); position: absolute; left: 0; top: 0;
    color: transparent; text-shadow: 0 2px 5px rgba(0,0,0,0.55);
  }
  #gameNav .gx-t span {
    display: block; position: relative;
    background: linear-gradient(180deg, #FFE9C4 0%, #FBCEA0 45%, #B88A4E 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  #gameNav .gx-t::after {
    content: attr(data-t); position: absolute; top: 0; left: 0; z-index: 2;
    width: 0; overflow: hidden; white-space: nowrap; opacity: 0;
    color: #FFF6E2; text-shadow: 0 0 8px rgba(255,214,150,0.55);
    transition: opacity 0.4s 0.2s, width 0.6s;
  }
  #gameNav button:hover .gx-t::after,
  #gameNav button:focus-visible .gx-t::after { opacity: 1; width: 100%; transition: opacity 0.4s, width 0.6s; }
  #gameNav .gx-foot {
    width: 10px; height: 9px; flex-shrink: 0; position: relative; top: 0px;   /* centred on the capitals (measured on a Mac screenshot) */
    background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyMiI+PGcgZmlsbD0iI0ZCQ0VBMCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIzLjIiIHI9IjMuMiIvPjxjaXJjbGUgY3g9IjMuMiIgY3k9IjkuNiIgcj0iMy4yIi8+PGNpcmNsZSBjeD0iMjAuOCIgY3k9IjkuNiIgcj0iMy4yIi8+PHBhdGggZD0iTTEwLjkgNS41aDIuMnY4LjJsNS4zLTMuNCAxLjIgMS44LTYuNCA2LjFjLS43LjctMS43LjctMi40IDBMNC40IDEyLjFsMS4yLTEuOCA1LjMgMy40eiIvPjxlbGxpcHNlIGN4PSIxMiIgY3k9IjE3LjYiIHJ4PSIzLjMiIHJ5PSIyLjYiLz48L2c+PC9zdmc+Cg==') center / contain no-repeat;
    opacity: 0.75; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
  }
  #gameNav { position: fixed; z-index: 9999; display: flex; visibility: hidden; }
  #gameNav button { background: transparent; border: none; cursor: pointer; text-transform: uppercase; line-height: 1; white-space: nowrap; }
  /* the old pixel SOUND box styling no longer applies */
  #gameNav #muteBtn { position: static; visibility: inherit; border: none; background: transparent; image-rendering: auto; }

  /* ═══════════ ACHIEVEMENT POP-UP (Xbox-style) ═══════════
     The badge pops in, the box stretches out to the left to reveal the text,
     holds, then the text fades and the box shrinks back around the badge
     before it pops away. Sits just below the top-right menu. */
  .ach-toast {
    position: fixed; top: 64px; right: 28px; z-index: 100000;
    height: 76px; width: 76px; border-radius: 38px; overflow: hidden;
    display: flex; align-items: center; pointer-events: none;
    background: linear-gradient(180deg, rgba(30,24,18,0.95), rgba(12,10,8,0.97));
    border: 1px solid rgba(251,206,160,0.45);
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    transform: scale(0); opacity: 0;
    transition: transform 0.45s cubic-bezier(0.3,1.6,0.5,1), opacity 0.25s, width 0.55s cubic-bezier(0.6,0,0.2,1);
  }
  .ach-toast.pop { transform: scale(1); opacity: 1; }
  .ach-toast.out { transform: scale(0); opacity: 0; transition: transform 0.35s cubic-bezier(0.6,-0.4,0.7,0), opacity 0.35s 0.1s; }
  .ach-badge {
    flex: 0 0 52px; height: 52px; margin: 0 11px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 40% 35%, #ffe9c4, #d9a46a 60%, #8a5a2a);
    box-shadow: 0 0 0 2px rgba(251,206,160,0.6), 0 0 14px rgba(251,206,160,0.4);
  }
  .ach-badge i { width: 24px; height: 22px; background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyMiI+PGcgZmlsbD0iIzJhMWEwYyI+PGNpcmNsZSBjeD0iMTIiIGN5PSIzLjIiIHI9IjMuMiIvPjxjaXJjbGUgY3g9IjMuMiIgY3k9IjkuNiIgcj0iMy4yIi8+PGNpcmNsZSBjeD0iMjAuOCIgY3k9IjkuNiIgcj0iMy4yIi8+PHBhdGggZD0iTTEwLjkgNS41aDIuMnY4LjJsNS4zLTMuNCAxLjIgMS44LTYuNCA2LjFjLS43LjctMS43LjctMi40IDBMNC40IDEyLjFsMS4yLTEuOCA1LjMgMy40eiIvPjxlbGxpcHNlIGN4PSIxMiIgY3k9IjE3LjYiIHJ4PSIzLjMiIHJ5PSIyLjYiLz48L2c+PC9zdmc+Cg==') center / contain no-repeat; }
  .ach-txt { white-space: nowrap; padding-right: 24px; opacity: 0; transform: translateX(-8px); transition: opacity 0.3s, transform 0.3s; }
  .ach-toast.open .ach-txt { opacity: 1; transform: none; transition: opacity 0.35s 0.3s, transform 0.35s 0.3s; }
  .ach-small { font-family: 'Spectral', Georgia, serif; font-weight: 600; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(251,206,160,0.78); }
  .ach-name { font-family: 'Spectral', Georgia, serif; font-weight: 600; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #FFE9C4; margin: 2px 0 3px; }
  .ach-desc { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 12px; line-height: 1.35; color: #d9cdb8; }
  @media (max-width: 640px) { .ach-toast { top: 12px; right: 10px; } .ach-txt { white-space: normal; } }
</style>
<script>
  // iPhones mute web page sound effects and music when the phone's silent
  // switch is on (sound made by the page itself, as opposed to video).
  // Tell Safari this site's sounds are part of the experience, like a game,
  // so they play like other media do. Ignored by browsers that don't support it.
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
</script>

<script>

<script>

// ── GAME WORLD
(function(){

  var fadeOverlay = document.getElementById('fadeOverlay');

  // Canvas setup
  var canvas = document.createElement('canvas');
  canvas.id = 'gameCanvas';
  canvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;display:none;image-rendering:pixelated;background:#000;';
  document.body.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false; // crisp pixel art, and cheaper to render than the default bilinear smoothing

  var skyGrad = null;
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    GROUND_Y = Math.floor(canvas.height * 0.85);
    platforms = makePlatforms();
    // Rebuild the cached sky gradient only when canvas size actually
    // changes - it was previously being created from scratch every
    // single frame in draw(), which gets more expensive the larger the
    // browser window is (full window vs a small preview pane, say).
    skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#0a0a1a');
    skyGrad.addColorStop(0.6, '#0f1a0f');
    skyGrad.addColorStop(1, '#0d2006');
  }
  resize();
  window.addEventListener('resize', resize);

  // ── WORLD CONSTANTS
  // Jump is tuned to keep roughly the same height as before (~290px) but
  // with a snappier arc: gravity and launch speed scaled together
  var GRAVITY = 0.95;
  var JUMP_FORCE = -23.5;
  var MOVE_SPEED = 9;
  var WORLD_WIDTH = 11300;

  // ── PLATFORMS
  // Ground height - frog stands here
  var GROUND_Y = Math.floor(canvas.height * 0.85);
  var GROUND_H = canvas.height; // extends to bottom of screen

  // Platforms defined relative to GROUND_Y so they scale with screen
  function makePlatforms(){
    return []; // Portals replace platforms
  }
  var platforms = makePlatforms();


  // ── AUDIO ENGINE
  var audioCtx = null;
  function getAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, type, duration, volume, freqEnd){
    try {
      var ctx = getAudio();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if(freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(volume || 0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e){}
  }

  function sfxJump(){ if(muted) return;
    playTone(180, 'square', 0.12, 0.18, 420);
  }

  function sfxFireball(){ if(muted) return;
    var scream = document.getElementById('fireballScream');
    if(scream){ scream.currentTime = 0; scream.play(); }
  }

  // Volumes for the tortoise clips (1 = full). About 0.7 is roughly 3dB quieter.
  var TORTOISE_HIT_VOLUME = 0.7;
  var TORTOISE_DEAD_VOLUME = 0.7;

  var tortoiseHitSounds = ['tortoiseHit1', 'tortoiseHit2', 'tortoiseHit3'];
  // Fireball hit: a fiery sizzle, a hissing searing burn with a light impact
  // (made in the browser, no sound files)
  function sfxHit(){ if(muted) return;
    try {
      var a = getAudio(), t0 = a.currentTime;
      function noiseBurst(start, dur, vol, type, f, q, fEnd){
        var len = Math.floor(a.sampleRate * (dur + 0.1)), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
        for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        var src = a.createBufferSource(); src.buffer = buf;
        var fl = a.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t0 + start); if(q) fl.Q.value = q;
        if(fEnd) fl.frequency.exponentialRampToValueAtTime(fEnd, t0 + start + dur);
        var g = a.createGain(); g.gain.setValueAtTime(0.0001, t0 + start); g.gain.exponentialRampToValueAtTime(vol, t0 + start + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
        src.connect(fl); fl.connect(g); g.connect(a.destination); src.start(t0 + start); src.stop(t0 + start + dur + 0.1);
      }
      noiseBurst(0, 0.6, 0.25, 'bandpass', 5000, 1.2, 1500);   // the sizzle
      noiseBurst(0, 0.15, 0.35, 'lowpass', 1200, 0.8, 200);    // the light impact
      playTone(220, 'triangle', 0.2, 0.12, 90);
    } catch(e){}
  }

  function sfxDeath(){
    if(muted) return;
    var clip = document.getElementById('tortoiseDead');
    if(clip){ clip.volume = TORTOISE_DEAD_VOLUME; clip.currentTime = 0; clip.play().catch(function(){}); }
  }

  // Dull "thud" for fireballs landing on the dead tortoise: a low pitch drop
  // for the body, plus a very short mid-range knock on top so it still reads
  // on laptop speakers, which can barely reproduce the deep part.
  function sfxThud(){
    if(muted) return;
    playTone(160, 'triangle', 0.22, 0.45, 42);
    playTone(95, 'square', 0.09, 0.14, 45);
    playTone(320, 'square', 0.03, 0.07, 140);
  }

    function sfxBubble(){ if(muted) return;
    playTone(440, 'square', 0.06, 0.12, 660);
    setTimeout(function(){ playTone(660, 'square', 0.08, 0.1, 440); }, 60);
  }

  // Tiny typewriter blip for the frog's intro dialogue. Skipped if the
  // audio context is not running yet, so a suspended context can never
  // queue up a burst of blips that all fire at once when it wakes.
  function sfxType(){
    if(muted) return;
    var ctx = getAudio();
    if(ctx.state !== 'running') return;
    playTone(640 + Math.random() * 120, 'square', 0.03, 0.04);
  }

  // ── CHIPTUNE TITLE MUSIC
  var titleMusicPlaying = false;
  var titleMusicNodes = [];

  function stopTitleMusic(){
    titleMusicPlaying = false;
    titleMusicNodes.forEach(function(n){ try{ n.stop(); }catch(e){} });
    titleMusicNodes = [];
  }

  function playTitleMusic(){
    if(titleMusicPlaying || muted) return;
    titleMusicPlaying = true;
    var ctx = getAudio();

    // Simple dark fantasy loop - minor key melody
    var melody = [
      [220, 0.25], [261, 0.25], [293, 0.25], [261, 0.25],
      [220, 0.5],  [196, 0.25], [220, 0.25],
      [174, 0.25], [196, 0.25], [220, 0.25], [196, 0.25],
      [174, 0.5],  [155, 0.25], [174, 0.25],
      [196, 0.25], [220, 0.25], [246, 0.25], [220, 0.25],
      [196, 0.5],  [174, 0.25], [196, 0.25],
      [220, 0.25], [196, 0.25], [174, 0.25], [155, 0.25],
      [146, 1.0]
    ];

    var bass = [
      [110, 0.5], [130, 0.5], [146, 0.5], [130, 0.5],
      [110, 0.5], [98,  0.5], [110, 0.5], [87,  0.5],
      [98,  0.5], [110, 0.5], [123, 0.5], [110, 0.5],
      [98,  0.5], [87,  0.5], [98,  0.5], [73,  1.0]
    ];

    function scheduleMelody(notes, type, vol, loop){
      if(!titleMusicPlaying) return;
      var t = ctx.currentTime + 0.1;
      var totalDur = 0;
      notes.forEach(function(n){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = type;
        osc.frequency.value = n[0];
        gain.gain.setValueAtTime(vol, t);

  var BG_MUSIC_VOLUME = 0.53;  // 1 = full. This track is about 5dB quieter than the last one, so this gives the same loudness. Lower it if it competes with the sound effects

  function fadeBgMusicTo(target, ms, done){
    var el = document.getElementById('bgMusic');
    if(!el) return;
    clearInterval(bgFadeTimer);
    var from = el.volume;
    var steps = Math.max(1, Math.round(ms / 50));
    var i = 0;
    bgFadeTimer = setInterval(function(){
      i++;
      el.volume = Math.max(0, Math.min(1, from + (target - from) * (i / steps)));

        clearInterval(bgFadeTimer);

  // One "pixel" of the bubble frame. Sized to sit in step with the 12px type.
  var BUBBLE_U = 3;

    var u = BUBBLE_U;
    ctx.fillStyle = colour;

    ctx.fillRect(x, y + u, w, h - 2 * u);

  // bx, by, bw, bh: box position and size. tx: x of the tail's centre.
  function drawBubble(bx, by, bw, bh, tx){
    var u = BUBBLE_U;
    notchRects(bx + u, by + u, bw, bh, BUBBLE_SHADOW);
    notchRects(bx, by, bw, bh, BUBBLE_LIME);
    notchRects(bx + u, by + u, bw - 2 * u, bh - 2 * u, BUBBLE_BROWN);
    var ty = by + bh - u;
    ctx.fillStyle = BUBBLE_LIME;
    ctx.fillRect(tx - 4 * u, ty,          8 * u, u);
    ctx.fillRect(tx - 3 * u, ty + u,      6 * u, u);
    ctx.fillRect(tx - 2 * u, ty + 2 * u,  4 * u, u);
    ctx.fillRect(tx - u,     ty + 3 * u,  2 * u, u);
    ctx.fillStyle = BUBBLE_BROWN;
    ctx.fillRect(tx - 3 * u, ty,          6 * u, u);
    ctx.fillRect(tx - 2 * u, ty + u,      4 * u, u);
    ctx.fillRect(tx - u,     ty + 2 * u,  2 * u, u);
  }

    for(var pi = 0; pi < portalPositions.length; pi++){
      var bobAmount = Math.sin(Date.now() * 0.0015 + pi * 0.7) * 4;
      portalPositions[pi].bobY = bobAmount;
    }

    // ZZZ particles when sleeping
    if(player.sleeping){
      zzzTimer += dt;
      if(zzzTimer >= 40){
        zzzTimer = 0;
        zzzParticles.push({
          x: player.x + player.w * 0.7,
          y: player.y + player.h * 0.2,
          opacity: 1,
          size: 14 + Math.random() * 8,
          vy: -0.8 - Math.random() * 0.4,
          vx: 0.3 + Math.random() * 0.3,
          life: 90
        });
      }
    } else {
      zzzTimer = 0;
    }
    // Update zzz particles
    for(var z = zzzParticles.length - 1; z >= 0; z--){
      var zp = zzzParticles[z];
      zp.x += zp.vx * dt;
      zp.y += zp.vy * dt;
      zp.life -= dt;
      zp.opacity = zp.life / 90;
      zp.size += 0.08 * dt;
      if(zp.life <= 0) zzzParticles.splice(z, 1);
    }

    // Enemy bubble timer
    if(enemy.bubbleTimer > 0){
      enemy.bubbleTimer -= dt;
      if(enemy.bubbleTimer <= 0){ enemy.bubbleTimer = 0; enemy.bubble = null; }
    }

    updateDialogue(dt);

    // Camera - follow player
    var targetCamX = player.x - canvas.width * 0.35;
    cam.x += (targetCamX - cam.x) * Math.min(0.1 * dt, 1);
    if(cam.x < 0) cam.x = 0;
    if(cam.x > WORLD_WIDTH - canvas.width) cam.x = WORLD_WIDTH - canvas.width;
    window.jccLightPos = cam.x; // read by chrome-logo.js so the logo's light follows the frog through the world
  }

  // ── DRAW
  function draw(dt){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fallback gradient - always drawn first as a base layer, so any gap
    // never shows as blank/black. Cached in resize() rather than rebuilt
    // every frame.
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Sky background with parallax - drawn once, never tiled, since this
    // is a single scenic image rather than a seamless pattern. It pans
    // across as the camera moves, then holds at its edge once it runs
    // out, rather than ever wrapping around and showing a repeat.
    var bgImg = sprites['bgSky'];
    if(bgImg && bgImg.complete && bgImg.naturalWidth > 0){
      var bgW = bgImg.naturalWidth;
      var bgH = bgImg.naturalHeight;
      // Scale to fill screen height
      var bgDrawH = canvas.height;
      var bgDrawW = bgW * (bgDrawH / bgH);
      // Parallax at 10% of camera speed, clamped so it never runs out of image
      var maxBgScroll = Math.max(0, bgDrawW - canvas.width);
      var bgScrollX = Math.min(cam.x * 0.1, maxBgScroll);
      ctx.drawImage(bgImg, -bgScrollX, 0, bgDrawW, bgDrawH);
    }

    ctx.save();
    ctx.translate(-cam.x, 0);



    // Ground - tiled image
    var gTile = sprites['groundTile'];
    if(gTile && gTile.complete && gTile.naturalWidth > 0){
      var tileH = 220; // drawn height of tile
      var tileW = Math.ceil(gTile.naturalWidth * (tileH / gTile.naturalHeight));
      var groundDrawY = GROUND_Y - 20; // raised slightly
      // Fill below ground with solid colour first
      ctx.fillStyle = '#0d1a06';
      ctx.fillRect(0, groundDrawY + tileH, WORLD_WIDTH, canvas.height);
      // Tile with 1px overlap to eliminate seam - only draw tiles that
      // are actually within (or just outside) the visible camera range,
      // rather than the entire world width every frame. Drawing all
      // ~38 tiles across the full 11300px world regardless of what's
      // on screen was the main cause of the page feeling slow overall.
      var tileStep = tileW - 1;
      var visStart = Math.floor(cam.x / tileStep) * tileStep - tileStep;
      var visEnd = Math.min(WORLD_WIDTH, cam.x + canvas.width + tileStep);
      for(var gx = Math.max(0, visStart); gx < visEnd; gx += tileStep){
        ctx.drawImage(gTile, gx, groundDrawY, tileW + 1, tileH);
      }
    } else {
      // Fallback solid ground
      ctx.fillStyle = '#1a3a0a';
      ctx.fillRect(0, GROUND_Y, WORLD_WIDTH, canvas.height);
    }

    // Elevated Platforms
    for(var i = 0; i < platforms.length; i++){
      var p = platforms[i];
      var ptileW = 32;
      for(var px = p.x; px < p.x + p.w; px += ptileW){
        var pw = Math.min(ptileW, p.x + p.w - px);
        // Platform body
        ctx.fillStyle = '#1a3a0a';
        ctx.fillRect(px, p.y, pw - 1, p.h);
        // Grass top
        ctx.fillStyle = '#d5e709';
        ctx.fillRect(px, p.y, pw - 1, 4);
        ctx.fillStyle = '#3a8a0a';
        ctx.fillRect(px, p.y + 4, pw - 1, 8);
        // Grass blades
        ctx.fillStyle = '#4aaa0a';
        ctx.fillRect(px + 4, p.y - 4, 4, 6);
        ctx.fillRect(px + 14, p.y - 6, 4, 8);
      }
    }

    // "BEWARE SHELLTON" sign, planted in the grass between the frog's
    // starting spot and the first portal (world space, behind the frog).
    var signImg = sprites['shelltonSign'];
    if(signImg && signImg.complete && signImg.naturalWidth > 0){
      var SIGN_H = 170, SIGN_X = 360;
      var signW = SIGN_H * signImg.naturalWidth / signImg.naturalHeight;
      if(SIGN_X + signW > cam.x - 50 && SIGN_X < cam.x + canvas.width + 50){
        // Bottom of the post on the same line as the frog's feet (GROUND_Y),
        // so the sign reads as standing on the same ground as him.
        ctx.drawImage(signImg, SIGN_X, GROUND_Y - SIGN_H, signW, SIGN_H);
      }
    }

    // Enemy

    // Draw portals
    var pImg = (portalFramesLoaded >= PORTAL_FRAME_COUNT) ? portalFrames[portalAnimFrame] : sprites['portal'];
    if(pImg && pImg.complete && pImg.naturalWidth > 0){
      var pAspect = pImg.naturalWidth / pImg.naturalHeight;
      var pDrawW = PORTAL_H * pAspect;
      for(var pi = 0; pi < portalPositions.length; pi++){
        var port = portalPositions[pi];
        // Skip portals nowhere near the camera's current view - this was
        // previously drawing every portal's glowing title text (with
        // shadowBlur, one of the most expensive canvas operations there
        // is) for all 18 portals every frame regardless of whether any
        // of them were even on screen.
        if(port.x + PORTAL_W < cam.x - 100 || port.x > cam.x + canvas.width + 100){
          continue;
        }
        var pDrawX = port.x + (PORTAL_W - pDrawW) / 2;
        var bobY = port.bobY || 0;
        ctx.save();
        ctx.globalAlpha = 1.0;
        ctx.drawImage(pImg, pDrawX, port.imgY + bobY, pDrawW, PORTAL_H);
        ctx.restore();

        // PRESS ENTER CTA when player is on this portal
        if(player.onPortal === pi && !player.enteringPortal){
          ctx.save();
          ctx.font = '9px "Press Start 2P"';
          ctx.textAlign = 'center';
          ctx.fillStyle = Math.floor(Date.now() / 400) % 2 === 0 ? '#ffffff' : '#d5e709';
          ctx.shadowColor = 'rgba(213,231,9,0.8)';
          ctx.shadowBlur = 8;
          var halfwayY = port.imgY + (port.grassY - port.imgY) * 0.58 + (port.bobY||0);
          ctx.shadowColor = 'rgba(0,0,0,0.9)';
          ctx.shadowBlur = 10;
          ctx.shadowOffsetY = 2;
          ctx.fillText('PRESS ENTER', port.x + PORTAL_W / 2, halfwayY);
          // Second pass for chartreuse glow
          ctx.shadowColor = '#d5e709';
          ctx.shadowBlur = 16;
          ctx.shadowOffsetY = 0;
          ctx.fillText('PRESS ENTER', port.x + PORTAL_W / 2, halfwayY);
          ctx.restore();
        }
        // Floating title above portal
        var floatOffset = Math.sin(Date.now() * 0.002 + pi * 0.8) * 6;
        ctx.save();
        ctx.font = 'italic 32px "IM Fell English"';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#d5e709';
        ctx.shadowColor = 'rgba(213,231,9,0.6)';
        ctx.shadowBlur = 12;
        ctx.fillText(PROJECT_NAMES[pi] || ('Project ' + (pi + 1)), port.x + PORTAL_W / 2, port.imgY + 60 + (port.bobY || 0));
        ctx.restore();
      }
    }

    if(enemy.alive || enemy.dying){
      // Draw body
      var eKey = enemy.dying ? 'tortoise-dead' : (enemy.hitFlash > 0 ? 'tortoise-hit' : 'tortoise-idle');
      var eImg = sprites[eKey];
      var eAspect = eImg && eImg.naturalWidth > 0 ? eImg.naturalWidth / eImg.naturalHeight : 1;
      var eDrawW = enemy.h * eAspect;
      // The collapsed image is drawn in slight perspective: his back foot sits
      // higher in the picture than his front. Lowering the whole body a touch
      // (4% of his height) plants that back foot on the floor; his front half
      // settles into the grass, nearer the viewer.
      // The standing and hit images are also drawn in slight perspective: his
      // back foot sits about 3.4% of his height above his nearest front foot.
      // Lowering him by that much plants the back foot on the floor, with his
      // nearer feet settling into the grass.
      var slamY = enemy.dying ? slamOffset() + enemy.h * 0.04 : enemy.h * 0.034;
      // Hit reaction (while alive): he jolts back away from the fireball and
      // settles, and flashes red for the first split second
      var recoilX = 0, redFlash = false;
      if(!enemy.dying && enemy.hitFlash > 0){
        var hp = (20 - enemy.hitFlash) / 20;
        recoilX = Math.round((enemy.recoilDir || 1) * 14 * Math.sin(Math.PI * Math.min(1, hp * 2)) * (1 - hp));
        redFlash = enemy.hitFlash > 13;
      }
      if(eImg && eImg.complete && eImg.naturalWidth > 0){
        ctx.drawImage(eImg, enemy.x + recoilX, enemy.y + slamY, eDrawW, enemy.h);
        if(redFlash){
          var tint = redTint(eImg, eDrawW, enemy.h);
          ctx.globalAlpha = enemy.hitFlash > 17 ? 1 : 0.5;
          ctx.drawImage(tint, enemy.x + recoilX, enemy.y + slamY, eDrawW, enemy.h);
          ctx.globalAlpha = 1;
        }
      } else {
        ctx.fillStyle = '#6a4378';
        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
      }

      drawDust();

      // Draw ghost rising above body when dying
      if(enemy.dying && (!enemy.slam || (enemy.slam.landed && enemy.slam.t > 54))){
        var gImg = sprites['tortoise-ghost'];
        if(gImg && gImg.complete && gImg.naturalWidth > 0){
          var gAspect = gImg.naturalWidth / gImg.naturalHeight;
          var gH = enemy.h * GHOST_SCALE;
          var gW = gH * gAspect;
          var gX = enemy.x + (eDrawW - gW) / 2;
          enemy.ghostDraw = { x: gX, y: enemy.ghostY, w: gW, h: gH };   // remembered for the speech bubble
          ctx.save();
          // See-through and softly glowing, with a faint flicker
          var flicker = 0.06 * Math.sin(enemy.ghostTimer * 0.11) + 0.03 * Math.sin(enemy.ghostTimer * 0.37);
          var ghostAlpha = (enemy.ghostRisen ? 0.7 : Math.min(enemy.ghostTimer / Math.max(60, (enemy.ghostRiseFrames || 180) * 0.35), 1) * 0.7) + flicker;
          ctx.globalAlpha = Math.max(0, ghostAlpha);
          ctx.shadowColor = 'rgba(165, 218, 255, 0.85)';
          ctx.shadowBlur = 22 + 6 * Math.sin(enemy.ghostTimer * 0.06);
          ctx.drawImage(gImg, gX, enemy.ghostY, gW, gH);
          ctx.restore();
        }
      }

      // Speech bubble
      if(enemy.bubble){
        var lines = enemy.bubble.split('\n');
        ctx.font = '12px "Press Start 2P"';
        var maxLineW = 0;
        for(var ml = 0; ml < lines.length; ml++){
          var lw = ctx.measureText(lines[ml]).width;
          if(lw > maxLineW) maxLineW = lw;
        }
        var bw = Math.ceil(Math.max(maxLineW + 36, 220) / 2) * 2;
        var bh = lines.length * 22 + 28;
        var bx = snapBubbleX(enemy.x + enemy.w/2 - bw/2);
        var by = Math.max(12, Math.round(enemy.y - bh - 16)); // never clip off the top of the screen
        var tailX = snapBubbleX(enemy.x + enemy.w/2);
        if(enemy.dying && enemy.ghostDraw){
          // Once he's dead: beside the ghost's face, in front of him (towards
          // the frog), so it never sits on top of the ghost or the pop-up
          var gd = enemy.ghostDraw;
          bx = snapBubbleX(gd.x + gd.w * GHOST_INK_L - bw - 14);
          by = Math.max(152, Math.round(gd.y + gd.h * GHOST_INK_TOP - bh * 0.35));   // and always below the achievement pop-up
          tailX = snapBubbleX(bx + bw - 30);
        }
        drawBubble(bx, by, bw, bh, tailX);
        // Text
        ctx.fillStyle = BUBBLE_TEXT;
        ctx.font = '12px "Press Start 2P"';
        ctx.textAlign = 'center';
        var textStartY = by + (bh - lines.length * 22) / 2 + 17;
        for(var l = 0; l < lines.length; l++){
          ctx.fillText(lines[l], bx + bw/2, textStartY + l * 22);
        }
      }
    }

    // ZZZ particles
    for(var z = 0; z < zzzParticles.length; z++){
      var zp = zzzParticles[z];
      ctx.save();
      ctx.globalAlpha = zp.opacity;
      ctx.font = 'bold ' + Math.floor(zp.size) + 'px "Press Start 2P"';
      ctx.fillStyle = '#d5e709';
      ctx.textAlign = 'center';
      ctx.fillText('Z', zp.x, zp.y);
      ctx.restore();
    }

    // Fireballs
    for(var f = 0; f < fireballs.length; f++){
      var fb = fireballs[f];
      fb.frame = (fb.frame || 0) + dt;
      var cx = fb.x + fb.w / 2;
      var cy = fb.y + fb.h / 2;
      var r = fb.w / 2;
      var wobble = Math.sin(fb.frame * 0.4) * 2;
      ctx.save();
      // Outer glow
      var grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r + 6);
      grd.addColorStop(0, 'rgba(255,255,100,0.9)');
      grd.addColorStop(0.3, 'rgba(255,140,0,0.8)');
      grd.addColorStop(0.7, 'rgba(255,60,0,0.5)');
      grd.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.beginPath();
      ctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
      // Core
      ctx.beginPath();
      ctx.arc(cx, cy + wobble, r * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = '#fff8aa';
      ctx.fill();
      // Flame trails
      ctx.fillStyle = 'rgba(255,140,0,0.7)';
      for(var t = 0; t < 3; t++){
        var tx = cx - (fb.vx > 0 ? 1 : -1) * (r * 0.5 + t * 6);
        var ty = cy + Math.sin(fb.frame * 0.3 + t) * 4;
        ctx.beginPath();
        ctx.arc(tx, ty, r * 0.3 - t * 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Player sprite - preserve natural aspect ratio
    var spriteKey = player.state === 'enter' ? 'frog-enter' : 'frog-' + player.state;
    var img = sprites[spriteKey];
    if(img && img.complete && img.naturalWidth > 0){
      var aspect = img.naturalWidth / img.naturalHeight;
      var drawH = player.h;
      var drawW = drawH * aspect;
      player.spriteW = drawW;
      // Keep collision width narrower (60% of sprite)
      player.w = drawW * 0.55;

      // Scale down when entering portal
      var enterScale = 1;
      if(player.enteringPortal){
        var shrinkProgress = Math.max(0, player.enterTimer - 30);
        enterScale = Math.max(0.9, 1 - (shrinkProgress / 480));
      }

      ctx.save();
      var spriteOffsetX = (drawW - player.w) / 2;
      var scaledW = drawW * enterScale;
      var scaledH = drawH * enterScale;
      var scaleOffsetX = (drawW - scaledW) / 2;
      var scaleOffsetY = drawH - scaledH;

      // ── Pulled into the portal: the frog lifts off, drifts to the centre
      // of the green swirl, spins faster and faster, stretches slightly and
      // shrinks away to nothing, just before the screen fades to black.
      var pullPortal = player.enteringPortal && player.onPortal >= 0 ? portalPositions[player.onPortal] : null;
      if(pullPortal){
        var t = Math.min(1, Math.max(0, (player.enterTimer - 6) / 62));   // ~1s, starting just after Enter
        var ease = t * t * (3 - 2 * t);                                     // smooth glide to the swirl
        var pull = t * t * t;                                               // spin and shrink accelerate
        var fromX = player.x - spriteOffsetX + drawW / 2;
        var fromY = player.y + drawH / 2;
        var toX = pullPortal.x + PORTAL_W / 2;
        var toY = pullPortal.imgY + (pullPortal.bobY || 0) + PORTAL_H * 0.42;   // centre of the swirl
        var cx = fromX + (toX - fromX) * ease;
        var cy = fromY + (toY - fromY) * ease;
        var size = 1 - 0.94 * (t * t);
        var spin = (player.facing === -1 ? -1 : 1) * Math.PI * 2 * 2.5 * pull;
        ctx.globalAlpha = t > 0.85 ? Math.max(0, 1 - (t - 0.85) / 0.15) : 1;
        ctx.translate(cx, cy);
        ctx.rotate(spin);
        ctx.scale((player.facing === -1 ? -1 : 1) * size * (1 - 0.22 * ease), size * (1 + 0.12 * ease));
        ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
      } else if(player.facing === -1){
        ctx.translate(player.x + drawW - spriteOffsetX + scaleOffsetX, player.y + scaleOffsetY);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0, scaledW, scaledH);
      } else {
        ctx.drawImage(img, player.x - spriteOffsetX + scaleOffsetX, player.y + scaleOffsetY, scaledW, scaledH);
      }
      ctx.restore();
    } else {
      ctx.fillStyle = '#d5e709';
      ctx.fillRect(player.x, player.y, player.w, player.h);
    }

    drawTongue();
    drawBubbles();
    drawDialogue();

    ctx.restore();

  }

  var gameStarted = true;

  // ── LOOP
  // Movement/animation previously assumed requestAnimationFrame always
  // fires at 60fps (e.g. player.x += player.vx, one fixed step per call).
  // If it fires slower than that for any reason - display refresh rate,
  // browser/OS throttling, whatever the specific cause on a given
  // machine - the whole game runs proportionally slower, uniformly,
  // since every timer and movement is tied directly to call count rather
  // than real elapsed time. dt below is 1.0 at a true 60fps and scales
  // accordingly (e.g. 2.0 at 30fps), and every per-frame change is now
  // multiplied by it, so real-world speed stays correct regardless of
  // how often the browser actually calls this loop.
  var lastFrameTime = performance.now();
  function loop(){
    var now = performance.now();
    var dt = (now - lastFrameTime) / (1000 / 60);
    dt = Math.min(Math.max(dt, 0), 3); // clamp to guard against huge gaps (e.g. backgrounded tab)
    lastFrameTime = now;
    update(dt);
    draw(dt);
    requestAnimationFrame(loop);
  }

  // ── AUTO START (no title screen - the intro sequence covers that now)
  {
    canvas.style.display = 'block';
    placeEnemy();
    makePlatformPortals();

    // Cover the screen immediately, before the first frame renders, so the
    // frog is never visible at its default start position while we
    // reposition it onto the return portal below
    var flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;background:#000;opacity:1;z-index:999999;pointer-events:none;';
    document.body.appendChild(flash);

    // Safe to reveal the sound button now - it's hidden underneath the
    // opaque flash above until that fades away below
    var navEl = document.getElementById('gameNav');
    if(navEl) navEl.style.setProperty('visibility', 'visible', 'important');

    var hudEl = document.getElementById('hud');
    if(hudEl) hudEl.style.display = 'block';

    var gameplayLogoEl = document.getElementById('gameplayLogo');
    if(gameplayLogoEl){
      gameplayLogoEl.style.display = 'block';

      // Clicking the logo goes back to the landing page, fading out first
      var leavingToLanding = false;
      gameplayLogoEl.addEventListener('click', function(){
        if(leavingToLanding || player.enteringPortal) return;
        leavingToLanding = true;
        stopGameMusic();
        var fade = document.createElement('div');
        fade.style.cssText = 'position:fixed;inset:0;background:#000;opacity:0;z-index:999999;transition:opacity 0.5s ease;pointer-events:none;';
        document.body.appendChild(fade);
        setTimeout(function(){ fade.style.opacity = '1'; }, 20);
        setTimeout(function(){ window.location.href = 'index.html'; }, 700);
      });

      // Hover bounce + croak, same as the logo on the landing page: a stepped,
      // low-framerate bob (70ms per step) with the croak at half volume
      var logoBobPlaying = false;
      var LOGO_BOB_OFFSETS = [0, -4, -6, -4, 0, 2, 0];
      gameplayLogoEl.addEventListener('mouseenter', function(){
        if(logoBobPlaying) return;
        logoBobPlaying = true;
        var croak = document.getElementById('logoCroak');
        if(croak && !muted){
          croak.volume = 0.5;
          croak.currentTime = 0;
          croak.play().catch(function(){});
        }
        var step = 0;
        (function nextStep(){
          if(step < LOGO_BOB_OFFSETS.length){
            gameplayLogoEl.style.transform = 'translateX(-50%) translateY(' + LOGO_BOB_OFFSETS[step] + 'px)';
            step++;
            setTimeout(nextStep, 70);
          } else {
            gameplayLogoEl.style.transform = 'translateX(-50%)';
            logoBobPlaying = false;
          }
        })();
      });
    }

    // Position frog on the correct portal before anything gets drawn,
    // or the normal ground start if there's no valid return portal
    if(RETURN_PORTAL !== null && RETURN_PORTAL < portalPositions.length){
      var rport = portalPositions[RETURN_PORTAL];
      player.x = rport.x + PORTAL_W / 2 - player.w / 2;
      player.y = rport.grassY - player.h;
      cam.x = Math.max(0, rport.x - canvas.width * 0.35);
    } else {
      player.y = GROUND_Y - player.h;
      // Fresh arrival (not coming back from a project page): frog says hello
      setTimeout(startDialogue, DIALOGUE_DELAY_MS);
    }

    setTimeout(playGameMusic, 300);
    loop();

    // Now reveal the correctly-positioned scene - stepped fade, matching
    // the same speed/style as the campfire scene's fade-in on the intro
    // page (10 steps, 180ms each), rather than a smooth CSS transition
    setTimeout(function(){
      var steps = 10, stepDelay = 180, i = 0;
      function stepFade(){
        i++;
        flash.style.opacity = 1 - (i / steps);
        if(i < steps){
          setTimeout(stepFade, stepDelay);
        } else {
          flash.remove();
        }
      }
      stepFade();
    }, 200);
  }

  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && gameStarted && !player.enteringPortal && player.onPortal >= 0){
      var pi = player.onPortal;
      player.enteringPortal = true;
      player.vx = 0;
      var destPage = PROJECT_PAGES[pi] + '?from=' + pi;
      var tSound = document.getElementById('teleportSound');
      if(tSound && !muted){ tSound.currentTime = 0; tSound.play(); }
      // His cry as he's pulled in takes turns between "help!" and "oh no!".
      // (Remembered between visits, since entering a portal leaves the page.)
      var cryN = 0;
      try { cryN = (parseInt(localStorage.getItem('jccPortalCry'), 10) || 0) + 1; localStorage.setItem('jccPortalCry', cryN); }
      catch(e){ cryN = Math.random() < 0.5 ? 1 : 2; }
      var cry = document.getElementById(cryN % 2 ? 'helpScream' : 'ohNo');
      if(cry && !muted){ cry.volume = 0.85; cry.currentTime = 0; cry.play().catch(function(){}); }
      stopGameMusic();
      setTimeout(function(){
        var flash = document.createElement('div');
        flash.style.cssText = 'position:fixed;inset:0;background:#000;opacity:0;z-index:999999;transition:opacity 0.5s ease;pointer-events:none;';
        document.body.appendChild(flash);
        setTimeout(function(){ flash.style.opacity = '1'; }, 20);
        setTimeout(function(){ window.location.href = destPage; }, 700);
      }, 1200);
    }
  });

})();
</script>
<script>
// Back button: the game was left mid-fade, so start it fresh instead of
// showing the black screen it was left on.
window.addEventListener('pageshow', function(e){ if(e.persisted) location.reload(); });
</script>
<script>
// Word menu: HOP TO THE WORK and ABOUT ME, with the site's fade to black.
(function(){
  function go(url){
    var f = document.createElement('div');
    f.style.cssText = 'position:fixed;inset:0;background:#000;opacity:0;z-index:999999;transition:opacity 0.5s ease;pointer-events:none;';
    document.body.appendChild(f);
    requestAnimationFrame(function(){ f.style.opacity = '1'; });
    setTimeout(function(){ window.location.href = url; }, 550);
  }
  var hop = document.getElementById('hopBtn'), about = document.getElementById('aboutBtn');
  if(hop) hop.addEventListener('click', function(){ this.blur(); go('lucozade-back-for-the-believers.html?from=0'); });
  if(about) about.addEventListener('click', function(){ this.blur(); go('about.html'); });
})();
</script>
